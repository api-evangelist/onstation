name: OnStation
description: >-
  OnStation is a digital stationing platform for road and highway construction
  projects, replacing paper station logs and manual chaining with GPS-based
  field documentation. Its iOS and Android mobile app lets crews, inspectors,
  and project managers identify exact station locations, drop and share flags,
  capture timestamped photos and notes, and complete forms in the field without
  extra hardware. A cloud Data Portal aggregates that field documentation into
  searchable, exportable DOT-ready reports for compliance and dispute
  resolution, while Active Worksite alerts drivers through Waze and OEM systems
  when crews are working. OnStation offers pre-built integrations with
  construction and survey systems including HCSS HeavyJob, Trimble and Bad Elf
  GNSS receivers, TransTech density gauges, FleetWatcher e-ticketing, and ESRI
  GIS, but does not currently publish a public developer API. Backed by Insight
  Partners and Techstars.
